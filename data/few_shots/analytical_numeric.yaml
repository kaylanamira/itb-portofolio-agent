examples:
  - nl: "Berapa rata-rata kehadiran mahasiswa semester ini dan kelas mana yang kehadirannya paling rendah?"
    sql: |
      SELECT
        kelas_id,
        kode_matkul,
        nama_matkul_id,
        no_kelas,
        nama_prodi_id,
        ROUND(AVG(pct_kehadiran_mahasiswa)::numeric, 2) AS avg_kehadiran_mahasiswa
      FROM analitik.v_akademik_kelas
      WHERE semester = 1 AND tahun = 2024
        AND pct_kehadiran_mahasiswa IS NOT NULL
      GROUP BY kelas_id, kode_matkul, nama_matkul_id, no_kelas, nama_prodi_id
      ORDER BY avg_kehadiran_mahasiswa ASC
      LIMIT 100;

  - nl: "Bagaimana tren nilai mahasiswa IF3140 dua tahun terakhir?"
    sql: |
      SELECT tahun_ajaran, semester, ROUND(AVG(avg_ip_akhir_mahasiswa)::numeric, 2) AS avg_nilai
      FROM analitik.v_akademik_kelas
      WHERE kode_matkul = 'IF3140'
        AND avg_ip_akhir_mahasiswa IS NOT NULL
      GROUP BY tahun_ajaran, semester
      ORDER BY tahun_ajaran, semester
      LIMIT 100;

  - nl: "Bagaimana perbandingan kehadiran dosen dan mahasiswa di prodi IF semester ini?"
    sql: |
      SELECT
        ROUND(AVG(pct_kehadiran_dosen), 2) AS avg_kehadiran_dosen,
        ROUND(AVG(pct_kehadiran_mahasiswa), 2) AS avg_kehadiran_mahasiswa
      FROM analitik.v_akademik_kelas
      WHERE kode_prodi = 'IF' AND semester = 1 AND tahun = 2024;

  - nl: "Prodi mana yang rata-rata nilai mahasiswanya di bawah 3.0 semester ini?"
    sql: |
      SELECT kode_prodi, nama_prodi_id, ROUND(AVG(avg_ip_akhir_mahasiswa)::numeric, 2) AS avg_nilai
      FROM analitik.v_akademik_kelas
      WHERE semester = 1 AND tahun = 2024
        AND avg_ip_akhir_mahasiswa IS NOT NULL
      GROUP BY no_prodi, kode_prodi, nama_prodi_id
      HAVING AVG(avg_ip_akhir_mahasiswa) < 3.0
      ORDER BY avg_nilai DESC
      LIMIT 100;

  - nl: "Ranking dosen berdasarkan skor evaluasi di prodi IF semester ini?"
    sql: |
      SELECT
        nama_dosen,
        avg_skor_overall,
        RANK() OVER (ORDER BY avg_skor_overall DESC) AS ranking
      FROM (
        SELECT
          unnest(semua_dosen_nama_gelar) AS nama_dosen,
          avg_skor_overall
        FROM analitik.v_akademik_kelas
        WHERE kode_prodi = 'IF' AND semester = 1 AND tahun = 2024
      ) sub
      WHERE avg_skor_overall IS NOT NULL
      ORDER BY ranking
      LIMIT 100;

  - nl: "Bagaimana skor pelaksanaan perkuliahan di prodi IF semester ganjil 2024, aspek mana yang tertinggi dan terendah?"
    sql: |
      WITH agg AS (
        SELECT
          AVG(avg_skor_capaian)           AS capaian,
          AVG(avg_skor_pelaksanaan)       AS pelaksanaan,
          AVG(avg_skor_sarana_prasarana)  AS sarana,
          AVG(avg_skor_perilaku_mahasiswa) AS perilaku,
          AVG(avg_skor_overall)           AS overall
        FROM analitik.v_akademik_statistik_prodi
        WHERE kode_prodi = 'IF' AND semester = 1 AND tahun = 2024
      )
      SELECT dimensi, ROUND(skor::numeric, 2) AS skor
      FROM agg
      CROSS JOIN LATERAL (VALUES
        ('Capaian Pembelajaran', agg.capaian),
        ('Pelaksanaan Perkuliahan', agg.pelaksanaan),
        ('Sarana & Prasarana', agg.sarana),
        ('Perilaku Mahasiswa', agg.perilaku),
        ('Overall', agg.overall)
      ) AS t(dimensi, skor)
      ORDER BY skor DESC;