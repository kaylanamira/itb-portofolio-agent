examples:
  - nl: "Bandingkan skor evaluasi IF2210 dan IF3140 semester ini"
    sql: |
      SELECT kode_matkul, nama_matkul_id, no_kelas, avg_skor_overall, avg_skor_pelaksanaan, avg_skor_capaian
      FROM analitik.v_akademik_kelas
      WHERE kode_matkul IN ('IF2210', 'IF3140') AND semester = 1 AND tahun = 2024
      ORDER BY kode_matkul, no_kelas
      LIMIT 100;

  - nl: "Perbandingan rata-rata nilai per prodi di STEI semester ini"
    sql: |
      SELECT kode_prodi, nama_prodi_id,
        ROUND(AVG(avg_ip_akhir_mahasiswa)::numeric, 2) AS avg_nilai,
        ROUND(AVG(avg_skor_overall)::numeric, 2) AS avg_evaluasi,
        COUNT(*) AS jumlah_kelas
      FROM analitik.v_akademik_kelas
      WHERE kode_fakultas = 'STEI' AND semester = 1 AND tahun = 2024
      GROUP BY no_prodi, kode_prodi, nama_prodi_id
      ORDER BY avg_nilai DESC
      LIMIT 100;

  - nl: "Perbandingan kehadiran dosen prodi IF vs II semester ini"
    sql: |
      SELECT kode_prodi,
        ROUND(AVG(pct_kehadiran_dosen)::numeric, 2) AS avg_kehadiran_dosen,
        ROUND(AVG(pct_kehadiran_mahasiswa)::numeric, 2) AS avg_kehadiran_mahasiswa,
        COUNT(*) AS jumlah_kelas
      FROM analitik.v_akademik_kelas
      WHERE kode_prodi IN ('IF', 'II') AND semester = 1 AND tahun = 2024
      GROUP BY no_prodi, kode_prodi
      ORDER BY kode_prodi
      LIMIT 100;

  - nl: "Mana dosen yang skor evaluasinya paling tinggi dan paling rendah semester ini di prodi IF?"
    sql: |
      WITH dosen_skor AS (
        SELECT DISTINCT ON (d_id)
          d_id,
          d_nama,
          avg_skor_overall
        FROM (
          SELECT
            unnest(semua_dosen_id) AS d_id,
            unnest(semua_dosen_nama_gelar) AS d_nama,
            avg_skor_overall
          FROM analitik.v_akademik_kelas
          WHERE kode_prodi = 'IF' AND semester = 1 AND tahun = 2024
            AND avg_skor_overall IS NOT NULL
        ) sub
        ORDER BY d_id, avg_skor_overall DESC
      )
      (SELECT d_nama, avg_skor_overall, 'tertinggi' AS kategori FROM dosen_skor ORDER BY avg_skor_overall DESC LIMIT 3)
      UNION ALL
      (SELECT d_nama, avg_skor_overall, 'terendah' AS kategori FROM dosen_skor ORDER BY avg_skor_overall ASC LIMIT 3);