examples:
  - nl: "Berapa rata-rata skor evaluasi IF2210 semester ini?"
    sql: |
      SELECT kode_matkul, nama_matkul_id, AVG(avg_skor_overall) AS avg_skor_evaluasi
      FROM analitik.v_akademik_kelas
      WHERE kode_matkul = 'IF2210' AND semester = 1 AND tahun = 2024
      GROUP BY kode_matkul, nama_matkul_id
      LIMIT 1;

  - nl: "Siapa saja dosen yang mengajar matkul basis data semester ini?"
    sql: |
      SELECT DISTINCT unnest(semua_dosen_nama_gelar) AS nama_dosen
      FROM analitik.v_akademik_kelas
      WHERE nama_matkul_id ILIKE '%basis data%' AND semester = 1 AND tahun = 2024
      ORDER BY nama_dosen
      LIMIT 100;

  - nl: "Berapa jumlah kelas di prodi IF semester ini?"
    sql: |
      SELECT COUNT(*) AS jumlah_kelas
      FROM analitik.v_akademik_kelas
      WHERE kode_prodi = 'IF' AND semester = 1 AND tahun = 2024;

  - nl: "Apa saja fakultas di ITB?"
    sql: |
      SELECT nama->>'id' as nama, kd_fak
      FROM utama.fakultas
      WHERE active = TRUE;

  - nl: "Berapa persentase kehadiran di kelas IF3140?"
    sql: |
      SELECT kode_matkul, no_kelas, pct_kehadiran_dosen, pct_kehadiran_mahasiswa
      FROM analitik.v_akademik_kelas
      WHERE kode_matkul = 'IF3140' AND semester = 1 AND tahun = 2024
      ORDER BY no_kelas
      LIMIT 100;

  - nl: "Berapa persen dosen di STEI yang ada di bawah kelompok keahlian RPL?"
    sql: |
      WITH stei_dosen AS (
        SELECT d.dosen_id, k.nama->>'id' AS nama_kk
        FROM utama.dosen d
        JOIN utama.kk k ON k.kk_id = d.kk_id
        WHERE d.kd_fak = 'STEI' AND d.active = TRUE
      ),
      summary AS (
        SELECT
          COUNT(*) AS total_dosen,
          COUNT(*) FILTER (WHERE nama_kk ILIKE '%Rekayasa Perangkat Lunak%') AS total_dosen_rpl
        FROM stei_dosen
      )
      SELECT
        total_dosen,
        total_dosen_rpl,
        ROUND(total_dosen_rpl * 100.0 / NULLIF(total_dosen, 0), 2) AS persentase_dosen_rpl
      FROM summary;

  - nl: "Berapa total prodi di STEI yang aktif?"
    sql: |
      SELECT COUNT(*) AS total_prodi
      FROM utama.program_studi
      WHERE kd_fak = 'STEI' AND active = TRUE;

  - nl: "Siapa dekan STEI saat ini?"
    sql: |
      SELECT d.nama_gelar AS nama_dekan
      FROM utama.fakultas f
      JOIN utama.dosen d ON d.dosen_id = f.dosen_id_dekan
      WHERE f.kd_fak = 'STEI' AND f.active = TRUE
      LIMIT 1;

  - nl: "Berapa jumlah dosen di fakultas STEI?"
    sql: |
      SELECT COUNT(*) AS jumlah_dosen
      FROM utama.dosen
      WHERE kd_fak = 'STEI' AND active = TRUE;

  - nl: "Siapa saja dosen yang mengajar IF2210 semester ini?"
    sql: |
      SELECT DISTINCT unnest(semua_dosen_nama_gelar) AS nama_dosen
      FROM analitik.v_info_umum_kelas_matkul
      WHERE kode_matkul = 'IF2210' AND semester = 1 AND tahun = 2024
      ORDER BY nama_dosen
      LIMIT 100;

  - nl: "Mata kuliah apa saja yang wajib di prodi IF?"
    sql: |
      SELECT DISTINCT kode_matkul, nama_matkul_id, kode_jenis_list, kode_sifat_list
      FROM analitik.v_info_umum_kelas_matkul
      WHERE kode_prodi = 'IF'
        AND is_wajib_itb = TRUE
      ORDER BY kode_matkul
      LIMIT 100;

  - nl: "Berapa jumlah dosen aktif dan kelas di prodi IF semester ini?"
    sql: |
      SELECT jumlah_kelas, jumlah_dosen_aktif, jumlah_mahasiswa_aktif
      FROM analitik.v_info_umum_institusi
      WHERE kode_prodi = 'IF' AND semester = 1 AND tahun = 2024
      LIMIT 1;

  - nl: "Kelas mana yang punya kehadiran mahasiswa terendah semester ini?"
    sql: |
      SELECT kelas_id, kode_matkul, nama_matkul_id, no_kelas, nama_prodi_id, pct_kehadiran_mahasiswa
      FROM analitik.v_akademik_kelas
      WHERE semester = 1 AND tahun = 2024
        AND pct_kehadiran_mahasiswa IS NOT NULL
      ORDER BY pct_kehadiran_mahasiswa ASC
      LIMIT 100;

  - nl: "Di prodi mana saja Bu Yani mengajar semester ini?"
    sql: |
      SELECT DISTINCT unnest(kode_prodi_diajar) AS kode_prodi
      FROM analitik.v_info_umum_dosen
      WHERE nama_dosen_gelar ILIKE '%yani%' AND semester = 1 AND tahun = 2024
      LIMIT 100;
