examples:
  - nl: "Kenapa nilai kelas IF3140 K3 lebih rendah dari K1 DAN K2 semester ini?"
    sql: |
      SELECT
        no_kelas,
        avg_ip_akhir_mahasiswa,
        pct_kehadiran_dosen,
        pct_kehadiran_mahasiswa,
        avg_skor_overall,
        avg_skor_pelaksanaan,
        avg_skor_capaian,
        jumlah_mahasiswa
      FROM analitik.v_akademik_kelas
      WHERE kode_matkul = 'IF3140' AND semester = 1 AND tahun = 2024
      ORDER BY no_kelas
      LIMIT 100;

  - nl: "Apa yang menyebabkan penurunan skor evaluasi di prodi IF semester ini dibanding semester lalu?"
    sql: |
      SELECT
        semester,
        tahun,
        tahun_ajaran,
        ROUND(AVG(avg_skor_overall)::numeric, 2) AS avg_evaluasi,
        ROUND(AVG(pct_kehadiran_dosen)::numeric, 2) AS avg_kehadiran_dosen,
        ROUND(AVG(pct_kehadiran_mahasiswa)::numeric, 2) AS avg_kehadiran_mahasiswa,
        ROUND(AVG(avg_ip_akhir_mahasiswa)::numeric, 2) AS avg_nilai
      FROM analitik.v_akademik_kelas
      WHERE kode_prodi = 'IF'
        AND ((semester = 2 AND tahun = 2023) OR (semester = 1 AND tahun = 2024))
      GROUP BY semester, tahun, tahun_ajaran
      ORDER BY tahun, semester
      LIMIT 10;