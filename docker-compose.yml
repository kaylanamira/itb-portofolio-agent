services:
  redis:
    image: redis:7-alpine
    container_name: itb_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # volumes:
    #   - redis_data:/data
    # command: redis-server --save 60 1 --loglevel warning

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: itb_redis_commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  redis_data: